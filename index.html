<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noomesh</title>
  <meta name="description" content="Noomesh — something new is taking shape.">
  <style>
    :root {
      --bg: #0b0e14;
      --fg: #e8ebf2;
      --muted: #8b93a7;
      --accent: #6ee7d8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    canvas#mesh {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.35;
    }
    main {
      position: relative;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    h1 .accent { color: var(--accent); }
    p.tagline {
      margin-top: 1rem;
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: var(--muted);
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.45rem 1.1rem;
      border: 1px solid rgba(139, 147, 167, 0.35);
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <canvas id="mesh"></canvas>
  <main>
    <h1>noo<span class="accent">mesh</span></h1>
    <p class="tagline">Something new is taking shape.</p>
    <span class="badge">Coming soon</span>
  </main>
  <script>
    const canvas = document.getElementById('mesh');
    const ctx = canvas.getContext('2d');
    let w, h, points;

    function resize() {
      w = canvas.width = innerWidth * devicePixelRatio;
      h = canvas.height = innerHeight * devicePixelRatio;
      const count = Math.min(70, Math.floor((innerWidth * innerHeight) / 18000));
      points = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.35 * devicePixelRatio,
        vy: (Math.random() - 0.5) * 0.35 * devicePixelRatio,
      }));
    }

    function tick() {
      ctx.clearRect(0, 0, w, h);
      const linkDist = 170 * devicePixelRatio;
      for (const p of points) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
      }
      for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
          const a = points[i], b = points[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < linkDist) {
            ctx.strokeStyle = `rgba(110, 231, 216, ${(1 - d / linkDist) * 0.4})`;
            ctx.lineWidth = devicePixelRatio;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      ctx.fillStyle = 'rgba(232, 235, 242, 0.6)';
      for (const p of points) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5 * devicePixelRatio, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }

    addEventListener('resize', resize);
    resize();
    tick();
  </script>
</body>
</html>
